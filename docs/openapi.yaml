components:
  schemas:
    AllUserUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        phone_number:
          type: string
          maxLength: 11
        national_code:
          type: string
          nullable: true
          maxLength: 13
      required:
      - name
      - phone_number
    AllUserList:
      type: object
      properties:
        uid:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 50
        phone_number:
          type: string
          maxLength: 11
        national_code:
          type: string
          nullable: true
          maxLength: 13
      required:
      - name
      - phone_number
    BookDetail:
      type: object
      properties:
        bid:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        published_date:
          type: string
          format: date
        availability_status:
          type: boolean
        category:
          type: object
          properties:
            cid:
              type: string
              maxLength: 20
            name:
              type: string
              maxLength: 255
            description:
              type: string
              nullable: true
          required:
          - name
        reservation:
          type: string
          readOnly: true
      required:
      - title
      - author
      - published_date
      - category
    SimpleBook:
      type: object
      properties:
        bid:
          type: string
          maxLength: 20
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        published_date:
          type: string
          format: date
        is_reserved:
          type: string
          readOnly: true
      required:
      - title
      - author
      - published_date
    UserReservation:
      type: object
      properties:
        rid:
          type: string
          maxLength: 20
        book:
          type: string
          readOnly: true
        book_details:
          type: string
          readOnly: true
        reservation_date:
          type: string
          format: date-time
        return_date:
          type: string
          format: date-time
      required:
      - reservation_date
    Category:
      type: object
      properties:
        cid:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
      required:
      - name
    CategoryWithBooks:
      type: object
      properties:
        cid:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
        books:
          type: array
          items:
            type: object
            properties:
              bid:
                type: string
                maxLength: 20
              title:
                type: string
                maxLength: 255
              author:
                type: string
                maxLength: 255
              published_date:
                type: string
                format: date
              availability_status:
                type: boolean
              reservation:
                type: string
                readOnly: true
            required:
            - title
            - author
            - published_date
      required:
      - name
      - books
    CreateUser:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
        phone_number:
          type: string
          maxLength: 11
        national_code:
          type: string
          nullable: true
          maxLength: 13
        password:
          type: string
          writeOnly: true
      required:
      - name
      - phone_number
      - password
    SuperUserCreation:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+\z
          maxLength: 150
        name:
          type: string
          maxLength: 50
        password:
          type: string
          writeOnly: true
        national_code:
          type: string
          nullable: true
          maxLength: 13
        phone_number:
          type: string
          maxLength: 11
      required:
      - username
      - name
      - password
      - phone_number
    TokenRefresh:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
          readOnly: true
      required:
      - refresh
    Book:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        author:
          type: string
          maxLength: 255
        published_date:
          type: string
          format: date
        category:
          type: string
        availability_status:
          type: boolean
        bid:
          type: string
          maxLength: 20
      required:
      - title
      - author
      - published_date
      - category
    Reservation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: string
          readOnly: true
        book:
          type: string
        reservation_date:
          type: string
          format: date-time
          readOnly: true
        return_date:
          type: string
          format: date-time
          nullable: true
        rid:
          type: string
          readOnly: true
      required:
      - book
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - current_password
      - new_password
      - confirm_password
    Empty:
      type: object
      properties: {}
      
    login:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
        phone_number:
          type: string
          maxLength: 11
      required:
      - password
      - phone_number
      
    logout:
      type: object
      properties:
        refresh_token:
          type: string
      required:
      - refresh_token
